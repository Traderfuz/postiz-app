name: Build and publish Boxi Postiz overlay

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/traderfuz/postiz-app
  BASE_DIGEST: sha256:785f97312f66a347fb96cdccc4ded5a33ced69a672c89a9adc8054e7d6a21dc5

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: corepack enable && corepack prepare pnpm@10.6.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Type-check orchestrator library
        run: pnpm exec tsc --noEmit --pretty false -p libraries/nestjs-libraries/tsconfig.json
      - name: Build orchestrator overlay
        run: pnpm --filter ./apps/orchestrator run build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable overlay tags
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.boxi
          push: true
          provenance: mode=max
          sbom: true
          build-args: POSTIZ_BASE=ghcr.io/gitroomhq/postiz-app@${{ env.BASE_DIGEST }}
          tags: |
            ${{ env.IMAGE }}:boxi-v2.23.0-refreshfix
            ${{ env.IMAGE }}:boxi-v2.23.0-refreshfix-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=boxi-v2.23.0-refreshfix-${{ github.sha }}
            org.opencontainers.image.base.digest=${{ env.BASE_DIGEST }}
